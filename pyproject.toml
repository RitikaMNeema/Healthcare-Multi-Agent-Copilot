[project]
name = "governed-multi-agent-copilot"
version = "0.1.0"
description = "A governed multi-agent LLM copilot: LangGraph orchestration, tool use, RAG, guardrails, human-in-the-loop approvals, an eval harness, and an audit/permissions layer."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.3.0",
    "langgraph>=1.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
copilot = "copilot.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
