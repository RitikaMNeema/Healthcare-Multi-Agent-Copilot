[project]
name = "healthcare-multi-agent-copilot"
version = "0.1.0"
description = "A governed healthcare claims/denial-management copilot: LangGraph orchestration, tool use over a synthetic claims DB, hybrid BM25/vector RAG with citation verification, guardrails, human-in-the-loop approvals, an eval harness, and an audit/permissions layer."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.3.0",
    "langgraph>=1.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
copilot = "copilot.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
